apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tapisaurus-cluster
  labels:
    app: tapisaurus
    tier: database
spec:
  serviceName: "tapisaurus-headless"
  replicas: 3
  selector:
    matchLabels:
      app: tapisaurus
  template:
    metadata:
      labels:
        app: tapisaurus
        tier: database
    spec:
      containers:
        - name: tapisaurus-engine
          image: tapiruslab/TapisaurusDB:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 27017
              name: mongo-wire
            - containerPort: 5432
              name: pg-wire
            - containerPort: 50051
              name: grpc
            - containerPort: 27018
              name: http-rest
          env:
            - name: TAPISAURUS_WIRE_PORT
              value: "27017"
            - name: TAPISAURUS_HTTP_PORT
              value: "27018"
            - name: TAPISAURUS_DATA_DIR
              value: "/data/tapisaurus"
            - name: TAPISAURUS_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: tapisaurus-credentials
                  key: admin-user
            - name: TAPISAURUS_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: tapisaurus-credentials
                  key: admin-password
            - name: TAPISAURUS_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tapisaurus-credentials
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 27018
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 27018
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /v1/health
              port: 27018
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: tapisaurus-storage
              mountPath: /data/tapisaurus
  volumeClaimTemplates:
    - metadata:
        name: tapisaurus-storage
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tapisaurus-service
  labels:
    app: tapisaurus
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      name: wire-protocol
    - port: 5432
      targetPort: 5432
      name: pg-wire
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 27018
      targetPort: 27018
      name: http-rest
  selector:
    app: tapisaurus
