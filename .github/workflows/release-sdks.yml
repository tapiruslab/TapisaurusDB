name: Release Native Binaries & Polyglot SDK Matrix — TapisaurusDB

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish Python wheel & sdist to PyPI via OIDC Trusted Publishing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  verify-sdk-matrix:
    name: Verify Manifests & Multi-Target SDK Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SDK version lockstep & target matrix
        run: python scripts/ci/verify_sdk_matrix.py --verify-matrix

  build-native-matrix:
    name: Build Native Binary Matrix (${{ matrix.target }})
    needs: verify-sdk-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_suffix: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_suffix: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release server and CLI binaries
        run: cargo build --release --target ${{ matrix.target }} -p tapisaurus-server -p tapisaurus-cli
      - name: Run deterministic simulation & core test suite
        run: cargo test --target ${{ matrix.target }} -p tapisaurus-sim -p tapisaurus-vector

  package-python-and-node-sdks:
    name: Build & Verify Python Wheel and Node.js Package
    needs: verify-sdk-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Python Wheel & Sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --sdist bindings/python --outdir dist/python
          python scripts/ci/verify_sdk_matrix.py --check-python-dist dist/python
      - name: Upload Python Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapisaurus-python-dist
          path: dist/python
      - name: Package Node.js SDK tarball
        working-directory: bindings/node
        run: npm pack

  publish-python-pypi:
    name: Publish Python SDK to PyPI (OIDC)
    needs: package-python-and-node-sdks
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download Python Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: tapisaurus-python-dist
          path: dist/python
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python
