services:
  # TapisaurusDB Database Engine (27017: Mongo, 5432: Postgres, 50051: gRPC, 27018: HTTP/REST)
  tapisaurus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tapisaurus-engine
    ports:
      - "27017:27017" # MongoDB Wire Protocol
      - "5432:5432"   # PostgreSQL Wire Protocol
      - "50051:50051" # gRPC / Protocol Buffers
      - "27018:27018" # TapisaurusDB REST / HTTP API
    environment:
      # --- Security: Set strong random secrets in production! ---
      TAPISAURUS_API_KEY: ${TAPISAURUS_API_KEY:-tapisaurus-secret-key}
      TAPISAURUS_CLUSTER_TOKEN: ${TAPISAURUS_CLUSTER_TOKEN:-tapisaurus-cluster-secret}
      TAPISAURUS_ALLOWED_ORIGINS: ${TAPISAURUS_ALLOWED_ORIGINS:-http://localhost:27020}

      # --- JWT Authentication ---
      # Generate a strong secret: openssl rand -hex 64
      TAPISAURUS_JWT_SECRET: ${TAPISAURUS_JWT_SECRET:-tapisaurus-jwt-secret-change-in-production}
      TAPISAURUS_TOKEN_TTL_SECS: ${TAPISAURUS_TOKEN_TTL_SECS:-3600}    # 1 hour

      # --- RBAC User Accounts ---
      TAPISAURUS_ADMIN_USER: ${TAPISAURUS_ADMIN_USER:-admin}
      TAPISAURUS_ADMIN_PASS: ${TAPISAURUS_ADMIN_PASS:-tapisaurus-admin-2026}
      TAPISAURUS_RW_USER: ${TAPISAURUS_RW_USER:-}    # Optional ReadWrite user
      TAPISAURUS_RW_PASS: ${TAPISAURUS_RW_PASS:-}
      TAPISAURUS_RO_USER: ${TAPISAURUS_RO_USER:-}    # Optional ReadOnly user
      TAPISAURUS_RO_PASS: ${TAPISAURUS_RO_PASS:-}

      # --- Rate Limiting ---
      TAPISAURUS_RATE_LIMIT: ${TAPISAURUS_RATE_LIMIT:-100}
      TAPISAURUS_BAN_STRIKES: ${TAPISAURUS_BAN_STRIKES:-3}

      # --- Request Limits ---
      TAPISAURUS_MAX_PAYLOAD_MB: ${TAPISAURUS_MAX_PAYLOAD_MB:-10}
      TAPISAURUS_REQUEST_TIMEOUT_SECS: ${TAPISAURUS_REQUEST_TIMEOUT_SECS:-30}

      # --- Logging ---
      TAPISAURUS_AUDIT_LOG: ${TAPISAURUS_AUDIT_LOG:-/data/logs/audit.jsonl}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - tapisaurus_data:/data
    restart: unless-stopped

  # TapisaurusDB Web Management Studio (Port 27020)
  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: tapisaurus-studio
    ports:
      - "27020:80"     # Open http://localhost:27020
    depends_on:
      - tapisaurus
    restart: unless-stopped

volumes:
  tapisaurus_data:
    driver: local
