[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tapisaurus"
version = "0.1.0"
description = "Official Python SDK for TapisaurusDB — The AI-Native Universal Multi-Model Database Engine"
authors = [
    { name = "Ahmad Faiz", email = "faiz@tapirusdb.com" }
]
license = { text = "BSL-1.1" }
readme = "README.md"
requires-python = ">=3.11"
keywords = ["tapisaurus", "database", "nosql", "vector", "ai", "hnsw", "graph", "grpc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Topic :: Database :: Database Engines/Servers",
    "Development Status :: 4 - Beta",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tapiruslab/TapisaurusDB"
Repository = "https://github.com/tapiruslab/TapisaurusDB"
Documentation = "https://github.com/tapiruslab/TapisaurusDB/tree/main/docs"
"Bug Tracker" = "https://github.com/tapiruslab/TapisaurusDB/issues"

[tool.setuptools.packages.find]
where = ["."]
