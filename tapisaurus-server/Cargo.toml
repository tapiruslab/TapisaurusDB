[package]
name = "tapisaurus-server"
description = "Server for TapisaurusDB — HTTP/REST API & MongoDB Wire Protocol (Port 27017)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tapisaurus-core = { path = "../tapisaurus-core" }
tapisaurus-catalog = { path = "../tapisaurus-catalog" }
tapisaurus-query = { path = "../tapisaurus-query" }
tapisaurus-vector = { path = "../tapisaurus-vector" }
tapisaurus-graph = { path = "../tapisaurus-graph" }
tapisaurus-security = { path = "../tapisaurus-security" }
serde = { workspace = true }
serde_json = { workspace = true }
bson = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
uuid = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { version = "0.6", features = ["timeout"] }
parking_lot = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }

[dev-dependencies]
tempfile = { workspace = true }
